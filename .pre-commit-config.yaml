repos:
  - repo: local
    hooks:
      - id: gradle-spotless-check
        name: Gradle Spotless check
        entry: ./gradlew spotlessCheck
        language: system
        pass_filenames: false
      - id: gradle-spotbugs
        name: Gradle SpotBugs
        entry: ./gradlew spotbugsMain spotbugsTest
        language: system
        pass_filenames: false
