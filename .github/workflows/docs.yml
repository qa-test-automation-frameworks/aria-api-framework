name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links-and-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject workstation-only links and unsupported superlatives
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'file:///' --include='*.md' .
          ! grep -RInE 'expert-level|bulletproof|production-ready|zero leakage' --include='*.md' .
      - name: Test local identifier and evidence path guards
        run: |
          bash scripts/test-check-local-identifiers.sh
          bash scripts/test-check-neutral-evidence-paths.sh
      - name: Check local identifiers and evidence paths
        run: |
          bash scripts/check-local-identifiers.sh
          bash scripts/check-neutral-evidence-paths.sh

