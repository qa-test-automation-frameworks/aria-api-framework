name: ARIA API Framework CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run bounded public-demo smoke with existing Booker test credentials
        type: boolean
        default: false
      env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

jobs:
  unsupported-java-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up unsupported JDK 17 for the rejection control
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Require an actionable JDK 21 rejection
        shell: bash
        run: |
          if output=$(./gradlew --no-daemon help 2>&1); then
            echo 'Gradle unexpectedly accepted unsupported JDK 17.'
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F 'ARIA requires JDK 21 to run Gradle; detected Java 17.' <<< "$output"

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency vulnerability review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  test:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ inputs.env || 'dev' }}
      pact_do_not_track: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for evidence contract validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Record deterministic suite start
        run: echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Capture actual Java and Gradle versions
        run: bash scripts/capture-build-versions.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Verify CI gate policy controls
        run: bash scripts/test-ci-gates.sh

      - name: Test native JUnit evidence adapter
        run: python3 scripts/test_emit_junit_evidence.py -v

      - name: Test actual build version capture
        run: python3 scripts/test_capture_build_versions.py -v

      - name: Run Gradle quality gate
        run: ./gradlew clean check securityScan allureReport -Denv=${ENV} --parallel

      - name: Collect deterministic JUnit evidence
        if: always()
        run: python3 scripts/emit_junit_evidence.py --reports build/test-results/test --output build/evidence/deterministic.json --scope aria.deterministic

      - name: Validate deterministic evidence
        if: always()
        run: node scripts/validate-evidence.mjs build/evidence/deterministic.json

      - name: Upload deterministic evidence and native reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-aria-deterministic
          path: |
            build/evidence/deterministic.json
            build/test-results/test/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

      - name: Collect separate contract and provider evidence
        if: always()
        run: |
          status=0
          for suite in contractTest pactProviderVerificationTest; do
            case "$suite" in
              contractTest) scope=aria.contract; output=build/evidence/contract.json ;;
              pactProviderVerificationTest) scope=aria.pact-provider; output=build/evidence/pact-provider.json ;;
            esac
            if ! python3 scripts/emit_junit_evidence.py --reports "build/test-results/$suite" --output "$output" --scope "$scope"; then
              status=1
            fi
          done
          exit "$status"

      - name: Validate contract and provider evidence
        if: always()
        run: node scripts/validate-evidence.mjs build/evidence/contract.json build/evidence/pact-provider.json

      - name: Upload contract/provider evidence and native reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-aria-contracts
          path: |
            build/evidence/contract.json
            build/evidence/pact-provider.json
            build/test-results/contractTest/TEST-*.xml
            build/test-results/pactProviderVerificationTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-sbom
          path: build/reports/cyclonedx/**

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aria-test-artifacts
          path: |
            build/reports
            build/test-results
            build/allure-results
            build/logs
            build/reports/spotbugs
            build/reports/openapi-coverage.md
            build/reports/cyclonedx

      - name: Upload OpenAPI coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-coverage
          path: build/reports/openapi-coverage.md

      - name: Upload quality reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: |
            build/reports/openapi-coverage.md
            build/reports/security-scan.md
            build/reports/test-duration-report.md
            build/reports/portfolio-metrics-v1.json
            build/reports/spotbugs/**
            build/reports/pitest/**

      - name: Upload Pact contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pact-contracts
          path: build/pacts/**

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport

  container-test:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ inputs.env || 'dev' }}
      pact_do_not_track: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for evidence contract validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Record container suite start
        run: echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Capture actual Java and Gradle versions
        run: bash scripts/capture-build-versions.sh

      - name: Run Docker-backed container tests
        run: ./gradlew containerTest -Denv=${ENV}

      - name: Collect container JUnit evidence
        if: always()
        run: python3 scripts/emit_junit_evidence.py --reports build/test-results/containerTest --output build/evidence/container.json --scope aria.container

      - name: Validate container evidence
        if: always()
        run: node scripts/validate-evidence.mjs build/evidence/container.json

      - name: Upload container evidence and native reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-aria-container
          path: |
            build/evidence/container.json
            build/test-results/containerTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

  shared-reference-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_IMAGE: quality-reference-application:aria-${{ github.run_id }}
      APP_IMAGE_LOCAL: 'true'
      APP_SOURCE_REVISION: 21af1f41561a6d83ae44933dd36d9daa5e6a6e4c
      APP_FIXTURE_VERSION: v0.1.0
      JAVA_VERSION: '21'
      ENV: reference-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out immutable APP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qa-test-automation-frameworks/quality-reference-application
          ref: 21af1f41561a6d83ae44933dd36d9daa5e6a6e4c
          path: reference-app
          persist-credentials: false

      - name: Set up Node for evidence validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Record shared application suite start
        run: echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Capture actual Java and Gradle versions
        run: bash scripts/capture-build-versions.sh

      - name: Build immutable APP source locally
        run: docker build --build-arg "APP_SOURCE_SHA=${APP_SOURCE_REVISION}" --tag "${APP_IMAGE}" reference-app

      - name: Start pinned APP and run ARIA shared-target suite
        run: bash scripts/with-reference-application.sh ./gradlew --no-daemon --max-workers=1 sharedReferenceAppTest sharedReferencePactVerificationTest

      - name: Check Pact against hosted-only breaking and additive candidates
        run: bash scripts/verify-reference-pact-mutations.sh reference-app

      - name: Emit shared target execution evidence
        if: always()
        env:
          EVIDENCE_TARGET_IDENTITY: quality-reference-application
          EVIDENCE_TARGET_REVISION: git:${{ env.APP_SOURCE_REVISION }}
          EVIDENCE_FIXTURE_VERSION: ${{ env.APP_FIXTURE_VERSION }}
          EVIDENCE_TARGET_ENVIRONMENT: isolated-github-actions
        run: python3 scripts/emit_junit_evidence.py --reports build/test-results/sharedReferenceAppTest --output build/evidence/shared-app.json --scope aria.shared-app

      - name: Validate shared target evidence
        if: always()
        run: node scripts/validate-evidence.mjs build/evidence/shared-app.json

      - name: Upload shared target evidence and native reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-aria-shared-app
          path: |
            build/evidence/shared-app.json
            build/test-results/sharedReferenceAppTest/TEST-*.xml
            build/test-results/sharedReferencePactVerificationTest/TEST-*.xml
            work/audit-2026-10-21/A3/controls/**
          if-no-files-found: error
          retention-days: 30

      - name: Summarize target identity
        if: always()
        run: |
          {
            echo '### ARIA shared reference application'
            echo
            echo "- Local image tag: ${APP_IMAGE}"
            echo "- Source revision: ${APP_SOURCE_REVISION}"
            echo "- Fixture version: ${APP_FIXTURE_VERSION}"
            echo '- Isolation: one ephemeral PostgreSQL database, container network, app namespace, and synthetic test token per CI job'
          } >> "$GITHUB_STEP_SUMMARY"

  evidence-failure-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for evidence contract validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Capture actual Java and Gradle versions
        run: bash scripts/capture-build-versions.sh

      - name: Record failure-control start
        run: echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Run isolated intentional failure
        id: control
        continue-on-error: true
        run: ./gradlew evidenceFailureControlTest

      - name: Require the native control to fail
        if: always()
        env:
          NATIVE_CONTROL_OUTCOME: ${{ steps.control.outcome }}
        run: test "$NATIVE_CONTROL_OUTCOME" = failure

      - name: Collect failure-control evidence
        if: always()
        run: python3 scripts/emit_junit_evidence.py --reports build/test-results/evidenceFailureControlTest --output build/evidence/failure-control.json --scope aria.evidence-failure-control

      - name: Validate failure-control schema
        if: always()
        run: node scripts/validate-evidence.mjs build/evidence/failure-control.json

      - name: Verify exactly one native failed case
        if: always()
        run: PYTHONPATH=scripts python3 scripts/verify_failed_evidence.py build/evidence/failure-control.json --reports build/test-results/evidenceFailureControlTest --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

      - name: Upload failure-control evidence and native report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-aria-failure-control
          path: |
            build/evidence/failure-control.json
            build/test-results/evidenceFailureControlTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

  quality-gate:
    if: always()
    needs:
      - unsupported-java-runtime
      - test
      - osv-scan
      - container-test
      - evidence-failure-control
      - shared-reference-app
      - dependency-review
      - live-smoke
      - live-smoke-not-requested
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required quality gates
        env:
          CI_EVENT: ${{ github.event_name }}
          JAVA_POLICY_RESULT: ${{ needs.unsupported-java-runtime.result }}
          RUN_LIVE_SMOKE: ${{ inputs.run_live_smoke || false }}
          TEST_RESULT: ${{ needs.test.result }}
          OSV_RESULT: ${{ needs.osv-scan.result }}
          CONTAINER_RESULT: ${{ needs.container-test.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          LIVE_RESULT: ${{ needs.live-smoke.result }}
          CONTROL_RESULT: ${{ needs.evidence-failure-control.result }}
          SHARED_APP_RESULT: ${{ needs.shared-reference-app.result }}
          SKIP_EVIDENCE_RESULT: ${{ needs.live-smoke-not-requested.result }}
        run: bash scripts/verify-ci-gates.sh

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"ARIA API Framework CI failed for ${GITHUB_REPOSITORY}@${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${SLACK_WEBHOOK_URL}"

  live-smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live_smoke)
    runs-on: ubuntu-latest
    env:
      ENV: dev
      GITHUB_TOKEN: ${{ github.token }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
      pact_do_not_track: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for evidence contract validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Record live smoke start
        run: echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Capture actual Java and Gradle versions
        run: bash scripts/capture-build-versions.sh

      - name: Validate live smoke credentials
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN}" || { echo 'GitHub job token is required' >&2; exit 1; }
          test -n "${BOOKER_USERNAME}" || { echo 'BOOKER_USERNAME is required for requested public-demo smoke' >&2; exit 1; }
          test -n "${BOOKER_PASSWORD}" || { echo 'BOOKER_PASSWORD is required for requested public-demo smoke' >&2; exit 1; }

      - name: Run requested live smoke tests
        run: ./gradlew liveSmokeTest -Denv=${ENV}

      - name: Collect live smoke JUnit evidence
        if: always()
        run: python3 scripts/emit_junit_evidence.py --reports build/test-results/liveSmokeTest --output build/evidence/live-smoke.json --scope aria.live-smoke

      - name: Validate live smoke evidence
        if: always()
        run: node scripts/validate-evidence.mjs build/evidence/live-smoke.json

      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-smoke-evidence
          path: |
            build/evidence/live-smoke.json
            build/test-results/liveSmokeTest/**
            build/reports/tests/liveSmokeTest/**
            build/allure-results/**
            build/logs/**
          retention-days: 30

  live-smoke-not-requested:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.run_live_smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for evidence contract validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Emit explicit not-requested record
        run: python3 scripts/emit_junit_evidence.py --reports build/test-results/liveSmokeTest --output build/evidence/live-smoke-skipped.json --scope aria.live-smoke --reason 'Live smoke was not requested for this workflow event.'

      - name: Validate skipped evidence
        run: node scripts/validate-evidence.mjs build/evidence/live-smoke-skipped.json

      - name: Upload skipped evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-aria-live-smoke-skipped
          path: build/evidence/live-smoke-skipped.json
          if-no-files-found: error
          retention-days: 30
