[versions]
allure = "2.35.2"
allurePlugin = "2.11.2"
assertj = "3.27.7"
commonsIo = "2.20.0"
cyclonedxPlugin = "3.2.4"
datafaker = "2.5.4"
jackson = "2.22.0"
junit = "5.10.2"
lombokPlugin = "9.5.0"
logback = "1.5.37"
owner = "1.0.12"
pact = "4.6.17"
pitestPlugin = "1.15.0"
restassured = "6.0.0"
